name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `prisma generate` loads prisma.config.ts, which requires the variable
      # to be set. Nothing in this job connects to a database.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh -d mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mesh:mesh@localhost:5432/mesh
      TEST_DATABASE_URL: postgresql://mesh:mesh@localhost:5432/mesh
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Verify migrations match the schema
        run: pnpm db:check

      - name: Integration tests
        run: pnpm turbo run test:int

      # Smoke test of the seed script against the migrated schema (tests truncate the tables anyway).
      - name: Seed
        run: pnpm db:seed

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh -d mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mesh:mesh@localhost:5432/mesh
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0001
      UPLOADS_DIR: ${{ github.workspace }}/apps/api/uploads
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare the database
        run: pnpm db:generate && pnpm db:deploy && pnpm db:seed

      - name: Build the API and the web app
        run: pnpm turbo run build --filter=@the-mesh/api --filter=@the-mesh/web

      - name: Install Playwright browsers
        run: pnpm --filter @the-mesh/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @the-mesh/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Every push to main is deployed (the box follows `latest`), so images are published only
  # after everything above passed. Pull requests build them without pushing.
  images:
    name: Docker images
    needs: [checks, integration, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
