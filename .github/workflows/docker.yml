name: Docker images

# Called by CI (ci.yml) once every check, the integration tests and the end-to-end tests
# have passed, so nothing untested is ever published: the box pulls `latest` on a timer.
# Three images: the API, the web server and the one-shot migrations (apps/migrate) that compose
# runs before the API; they move together. On pull requests they are built only (catches
# Dockerfile breakage); on pushes to main they are published to GHCR as `latest` + `sha-…`, on release tags `vX.Y.Z` as
# `X.Y.Z`, `X.Y` (the semver patterns drop the `v`) and `latest`. The server pulls what `TAG`
# in its .env points at. The caller's event and ref apply here, and its concurrency group
# covers this workflow too.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, migrate]
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR requires lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beso-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          # Baked into the web bundle (the other images ignore them). Repository variables:
          # Settings → Secrets and variables → Actions → Variables.
          build-args: |
            VITE_OPERATOR_NAME=${{ vars.VITE_OPERATOR_NAME }}
            VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
            VITE_REPOSITORY_URL=${{ vars.VITE_REPOSITORY_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
