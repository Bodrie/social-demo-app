packages:
  - apps/*
  - packages/*

# pnpm refuses to run dependency postinstall scripts unless approved here
# (`pnpm approve-builds <pkg>`). prisma/@prisma/engines fetch the schema
# engine, argon2 its prebuilt native binary, esbuild (used by tsx) its binary.
allowBuilds:
  '@prisma/engines': true
  argon2: true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false

# Single source of truth for versions. Workspaces reference them with "catalog:".
catalog:
  # tooling
  typescript: 6.0.3
  '@types/node': 24.19.2
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  vite: 8.3.4
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  prettier: 3.9.10
  turbo: 2.11.8
  tsdown: 0.23.1
  # shared
  zod: 4.6.7
  # api
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/platform-express': 12.1.3
  '@nestjs/testing': 12.1.3
  '@nestjs/cli': 12.0.8
  '@nestjs/schematics': 12.0.7
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  source-map-support: 0.5.21
  supertest: 7.3.1
  '@types/supertest': 7.2.1
  '@types/express': 5.0.6
  # database
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  '@nestjs/config': 12.0.1
  argon2: 0.45.1
  dotenv: 18.0.8
  tsx: 4.23.15
  '@faker-js/faker': 10.6.0
  '@testcontainers/postgresql': 12.2.1
  # web
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  jsdom: 30.1.2
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/user-event': 14.6.8
